# ============================================================================
# console-tap 的 bundle 补丁 —— 官方契约:`dsh.bundle.patch` 指向本文件
# (与 @deepseek-ai/dsh-base / dsh-web-app 同一套机制:bundle 补丁按顺序叠加在
#  组合树上,后面的层可以按 id 覆盖前面的行;用户自己的 profile 补丁仍在最后。)
#
# 这里只插**一行**,而且是**裸包名**(官方 bundle 的写法都用裸包名):
#   · 宿主半个:这条行会让 DSH import 本包(入口 = package.json 的 main = lib/host.js);
#     热插入路径下 Cordis 可能不调 apply —— 本插件在 import 阶段**自举挂载**兜底,所以照样生效。
#   · 浏览器半个:官方 dsh-client-modules 扫到本包声明了 `dsh.client`,会自动把
#     /plugins/@local/dsh-console-tap-ui/client.js 作为一行注入 WebUI 的 boot 清单。
#
# 想改配置:在**你自己的** profile 补丁( ~/.dsh/profiles/web/cordis.patch.yml )里按 id
# 覆盖即可(后写的层覆盖前面的行,注意覆盖会替换整段 config,要写全):
#   - id: console-tap
#     config: { pollMs: 300, fileLogBytes: 0 }
# ============================================================================
- insert:
    - id: console-tap
      name: '@local/dsh-console-tap-ui'
      config:
        pollMs: 150            # 采集轮询间隔(ms):越小越实时
        memoryBytes: 262144    # 中途接入订阅者时的尾部快照上限
        fileLogBytes: 67108864 # 单条命令输出留档上限(字节;0 = 不留档)
        trace: false           # true = 把每次读的真实偏移写 console-tap-drain.jsonl(排查完整性)
